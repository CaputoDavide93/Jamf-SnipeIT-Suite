<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 678" width="1180" height="678" role="img" aria-label="Five EventBridge rules run one Fargate task, which pulls its image from ECR, reads secrets and the run lock from SSM, logs to CloudWatch and caches AI decisions in S3. The task reads and writes Jamf Pro, Snipe-IT and Azure AD, only reads HiBob, reports to Slack and asks the Anthropic API about ambiguous matches. Failed or unlaunched runs alert through SNS."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#94a3b8"/></marker></defs><rect x="24" y="36" width="664" height="572" rx="14" fill="#f7f9fb" stroke="#d8dee4" stroke-width="1" stroke-dasharray="6 5"/><text x="42.0" y="60.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6673" text-anchor="start" font-weight="600">AWS, EU-WEST-1</text><rect x="56" y="72" width="220" height="64" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(72.0,85.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 1 0 0-18z M12 7v5l3.5 2"/></g><text x="103.0" y="100.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">EventBridge</text><text x="72.0" y="124.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">5 cron rules run the task</text><polyline points="284,104.0 348,104.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><rect x="56" y="148" width="220" height="64" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(72.0,161.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/></g><text x="103.0" y="176.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">ECR</text><text x="72.0" y="200.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">image :latest and :base</text><polyline points="284,180.0 348,180.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><rect x="56" y="224" width="220" height="64" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(72.0,237.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8a4 4 0 1 0 0 8 4 4 0 1 0 0-8z M12 12h9 M18 12v3.5 M21 12v2.5"/></g><text x="103.0" y="252.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">SSM Parameter Store</text><text x="72.0" y="276.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">secrets and the run lock</text><polyline points="284,256.0 348,256.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/><rect x="56" y="300" width="220" height="64" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(72.0,313.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3z M7 10l3 2.5L7 15 M12.5 15h4.5"/></g><text x="103.0" y="328.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">CloudWatch Logs</text><text x="72.0" y="352.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">container output</text><polyline points="348,332.0 284,332.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><rect x="56" y="376" width="220" height="64" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(72.0,389.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16l-2 14H6z M4 6c0-1.5 3.6-2.5 8-2.5s8 1 8 2.5"/></g><text x="103.0" y="404.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">S3 AI cache</text><text x="72.0" y="428.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">AI resolver decisions</text><polyline points="284,408.0 348,408.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/><rect x="356" y="72" width="300" height="368" rx="10" fill="#2b59c3" stroke="#2b59c3" stroke-width="1"/><g transform="translate(372.0,85.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v7H4z M4 13h16v7H4z M8 7.5h.01 M8 16.5h.01 M12 7.5h4 M12 16.5h4"/></g><text x="403.0" y="100.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">ECS Fargate task</text><text x="372.0" y="124.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">linux/amd64, read-only root fs</text><text x="372.0" y="142.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">RUN_MODE picks the module set</text><text x="372.0" y="160.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">every job holds the RunMutex</text><text x="372.0" y="194.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="start" font-weight="600" opacity="0.85">LIFECYCLE</text><text x="372.0" y="214.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#ffffff" text-anchor="start">azure-starters, user-enrichment,</text><text x="372.0" y="232.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#ffffff" text-anchor="start">rehire-detection, leavers</text><text x="372.0" y="260.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="start" font-weight="600" opacity="0.85">SYNC</text><text x="372.0" y="280.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#ffffff" text-anchor="start">user-match, correction,</text><text x="372.0" y="298.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#ffffff" text-anchor="start">snipe-to-jamf, model-sync,</text><text x="372.0" y="316.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#ffffff" text-anchor="start">peripherals-sync</text><text x="372.0" y="344.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="start" font-weight="600" opacity="0.85">MAINTENANCE</text><text x="372.0" y="364.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#ffffff" text-anchor="start">cleanup, health-check, ai-audit,</text><text x="372.0" y="382.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#ffffff" text-anchor="start">reconciliation, monthly-digest,</text><text x="372.0" y="400.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#ffffff" text-anchor="start">pending-reconciliation,</text><text x="372.0" y="418.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#ffffff" text-anchor="start">jamf-location-cleanup</text><rect x="872" y="72.0" width="284" height="48" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(888.0,86.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14v10H5z M3 15h18l1.5 4h-21z"/></g><text x="919.0" y="101.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600">Jamf Pro</text><polyline points="664,96.0 864,96.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="764.0" y="87.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">devices, local accounts</text><rect x="872" y="136.0" width="284" height="48" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(888.0,150.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h8l10 10-8 8L3 11z M7.5 7.5h.01"/></g><text x="919.0" y="165.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600">Snipe-IT</text><polyline points="664,160.0 864,160.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="764.0" y="151.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">users, assets, accessories</text><rect x="872" y="200.0" width="284" height="48" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(888.0,214.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 20 6v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z M8.5 12l2.5 2.5 4.5-4.5"/></g><text x="919.0" y="229.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600">Azure AD / Entra ID</text><polyline points="664,224.0 864,224.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="764.0" y="215.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">groups, account status</text><rect x="872" y="264.0" width="284" height="48" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(888.0,278.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 1 0 0 7z M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6 M16 4.5a3.5 3.5 0 0 1 0 6.5 M18 14c2.2.6 3.5 2.8 3.5 6"/></g><text x="919.0" y="293.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600">HiBob, read-only</text><polyline points="664,288.0 864,288.0" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="764.0" y="279.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">employees, equipment</text><rect x="872" y="328.0" width="284" height="48" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(888.0,342.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z M8 9.5h8 M8 12.5h5"/></g><text x="919.0" y="357.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600">Slack</text><polyline points="664,352.0 864,352.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="764.0" y="343.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">summaries, human queue</text><rect x="872" y="392.0" width="284" height="48" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(888.0,406.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8h8v8H8z M5 5h14v14H5z M10 2v3 M14 2v3 M10 19v3 M14 19v3 M2 10h3 M2 14h3 M19 10h3 M19 14h3"/></g><text x="919.0" y="421.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600">Anthropic API</text><polyline points="664,416.0 864,416.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="764.0" y="407.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">ambiguous matches, audit</text><rect x="356" y="488" width="300" height="88" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(372.0,501.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z M10 20.5a2 2 0 0 0 4 0"/></g><text x="403.0" y="516.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Failure alerts</text><text x="372.0" y="540.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">task stopped non-zero, or a</text><text x="372.0" y="558.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">schedule that failed to launch</text><polyline points="506.0,448 506.0,480" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="56" y="488" width="220" height="88" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(72.0,501.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12H3z M3 6l9 7 9-7"/></g><text x="103.0" y="516.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">SNS alerts topic</text><text x="72.0" y="540.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">plus an optional</text><text x="72.0" y="558.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">email subscription</text><polyline points="348,532 284,532" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><line x1="24" y1="626" x2="1156" y2="626" stroke="#e6e9ee" stroke-width="1"/><text x="24.0" y="652.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Five schedules, one task definition: the RUN_MODE each rule passes decides which modules run. HiBob is only ever read.</text></svg>
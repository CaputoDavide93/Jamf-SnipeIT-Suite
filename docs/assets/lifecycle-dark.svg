<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 440" width="1180" height="440" role="img" aria-label="A new hire becomes an active user. When they leave, their name is tagged [Disabled] and their assets go to Pending. Rehire detection restores them only when all four signals agree; anything less is reported to Slack for a human, and anyone who stays gone is kept for audit, never deleted."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker></defs><rect x="24" y="64" width="200" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(40.0,77.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 11a4 4 0 1 0 0-8 4 4 0 1 0 0 8z M3 21c0-4 3-7 7-7s7 3 7 7 M19 8v6 M16 11h6"/></g><text x="71.0" y="92.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">New hire</text><text x="40.0" y="116.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">azure-starters creates</text><text x="40.0" y="134.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">the Snipe-IT user</text><rect x="300" y="64" width="240" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(316.0,77.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11a4 4 0 1 0 0-8 4 4 0 1 0 0 8z M5 21c0-4 3-7 7-7s7 3 7 7"/></g><text x="347.0" y="92.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Active</text><text x="316.0" y="116.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">assets checked out</text><text x="316.0" y="134.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">by user-match</text><rect x="616" y="64" width="264" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(632.0,77.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 11a4 4 0 1 0 0-8 4 4 0 1 0 0 8z M3 21c0-4 3-7 7-7s7 3 7 7 M16.5 8.5l5 5 M21.5 8.5l-5 5"/></g><text x="663.0" y="92.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">[Disabled]</text><text x="632.0" y="116.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">leavers tags the name,</text><text x="632.0" y="134.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">assets set to Pending</text><rect x="956" y="64" width="200" height="84" rx="10" fill="#1b2230" stroke="#30363d" stroke-width="1"/><g transform="translate(972.0,77.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18v4H3z M5 8v12h14V8 M10 12h4"/></g><text x="1003.0" y="92.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Kept for audit</text><text x="972.0" y="116.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">never deleted</text><polyline points="232,106.0 292,106.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="548,106.0 608,106.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="578.0" y="97.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">leaves</text><polyline points="888,106.0 948,106.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="918.0" y="97.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">stays gone</text><rect x="616" y="236" width="264" height="124" rx="10" fill="#4c7ef3" stroke="#4c7ef3" stroke-width="1"/><g transform="translate(632.0,249.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7 M20 4v4.5h-4.5"/></g><text x="663.0" y="264.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">Rehire detection</text><text x="632.0" y="288.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">Azure AD account enabled</text><text x="632.0" y="306.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">not in leavers or disabled group</text><text x="632.0" y="324.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">no leave date in the past</text><text x="632.0" y="342.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">HiBob lists them as active</text><polyline points="748.0,156 748.0,228" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="760.0" y="196.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">every [Disabled] user</text><rect x="300" y="248.0" width="240" height="100" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(316.0,261.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 11a4 4 0 1 0 0-8 4 4 0 1 0 0 8z M3 21c0-4 3-7 7-7s7 3 7 7 M16 11l2 2 4-4"/></g><text x="347.0" y="276.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Restored</text><text x="316.0" y="300.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">[Disabled] prefix stripped,</text><text x="316.0" y="318.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Pending assets to Deployed</text><polyline points="608,298.0 548,298.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="578.0" y="289.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">all four</text><polyline points="420.0,240.0 420.0,156" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="432.0" y="202.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">back to active</text><rect x="956" y="248.0" width="200" height="100" rx="10" fill="#2a1d14" stroke="#ffa657" stroke-width="1"/><g transform="translate(972.0,261.0) scale(0.8750)" fill="none" stroke="#ffa657" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 22 20H2z M12 10v4 M12 17h.01"/></g><text x="1003.0" y="276.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffa657" text-anchor="start" font-weight="600">Ambiguous</text><text x="972.0" y="300.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffa657" text-anchor="start">reported to Slack,</text><text x="972.0" y="318.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffa657" text-anchor="start">nothing is changed</text><polyline points="888,298.0 948,298.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="918.0" y="289.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">any fails</text><line x1="24" y1="388" x2="1156" y2="388" stroke="#232a33" stroke-width="1"/><text x="24.0" y="414.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">The suite never guesses about people: a restore needs every signal, and anything less waits for a human.</text></svg>
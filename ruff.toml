# Lint baseline: syntax errors and undefined names only, so existing code passes.
# Widen to ["E4", "E7", "E9", "F"] after a cleanup pass (62 findings as of 2026-09-25,
# mostly unused imports/variables).
target-version = "py312"
extend-exclude = [".venv", "logs", "output"]

[lint]
select = ["E9", "F63", "F7", "F82"]
